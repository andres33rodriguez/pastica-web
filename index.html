<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEFDF9" />
    <script>
      // Visitors who already saw the preloader this session never see it again
      // (the pre-rendered HTML always contains it; see src/components/Preloader.jsx).
      try {
        if (sessionStorage.getItem('pastica_preloader_seen') === '1') {
          document.documentElement.classList.add('no-preloader');
        }
      } catch (e) {}
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts used above the fold on every page: fetch them early so the text doesn't reflow when they arrive. -->
    <link rel="preload" href="/fonts/BeniterTrial.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/Standard-Book.otf" as="font" type="font/otf" crossorigin />

    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
